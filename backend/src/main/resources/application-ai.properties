# Optional profile. Keep the API key in environment variables, never in source.
app.ai.enabled=true
spring.ai.model.chat=openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.max-tokens=${AI_MAX_TOKENS:600}
spring.ai.openai.chat.n=1
spring.ai.openai.chat.store=false
spring.ai.openai.timeout=20s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
# Keep prompts/completions out of optional observation payloads.
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
