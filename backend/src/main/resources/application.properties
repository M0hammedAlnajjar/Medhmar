spring.application.name=gulf-racing
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gulf_racing}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration/{vendor}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.oauth2.success-url=${OAUTH_SUCCESS_URL:http://localhost:5500/}
app.mail.from=${MAIL_FROM:}
app.password-reset.url=${PASSWORD_RESET_URL:}

# AI is opt-in: activate the ai profile and configure AI_API_KEY.
app.ai.enabled=false
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}
app.ai.max-concurrent-requests=${AI_MAX_CONCURRENT_REQUESTS:4}
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
