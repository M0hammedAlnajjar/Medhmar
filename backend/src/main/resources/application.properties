spring.application.name=gulf-racing
server.port=${PORT:8080}

# Set these environment variables in your terminal or IDE run configuration.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gulf_racing}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database DDL is maintained separately in database/schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
