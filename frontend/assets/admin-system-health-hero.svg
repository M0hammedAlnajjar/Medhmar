<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" role="img" aria-labelledby="title desc">
  <title id="title">Medhmar platform infrastructure illustration</title>
  <desc id="desc">Abstract server, API, and database symbols connected by softly glowing gold lines. Decorative illustration, not live system status.</desc>
  <defs>
    <linearGradient id="ground" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#251a18"/>
      <stop offset=".52" stop-color="#38261f"/>
      <stop offset="1" stop-color="#563729"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e4a35d" stop-opacity=".24"/>
      <stop offset="1" stop-color="#e4a35d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7b48d" stop-opacity=".23"/>
      <stop offset="1" stop-color="#d7b48d" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0b889" stop-opacity=".08"/>
      <stop offset=".52" stop-color="#f9daae" stop-opacity=".88"/>
      <stop offset="1" stop-color="#e0b889" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#ddbd98" fill-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1600" height="240" fill="url(#ground)"/>
  <rect x="520" width="1080" height="240" fill="url(#dots)"/>
  <ellipse cx="1115" cy="121" rx="380" ry="194" fill="url(#halo)"/>
  <g stroke="#d6ac7d" stroke-opacity=".1" fill="none">
    <path d="M620 208Q855 157 1072 205T1600 182"/>
    <path d="M615 228Q880 182 1093 222T1600 208"/>
    <path d="M770 0V240 M980 0V240 M1190 0V240 M1400 0V240" stroke-dasharray="2 18"/>
  </g>
  <!-- Decorative infrastructure links, not actual monitoring signals -->
  <g fill="none" stroke="url(#wire)" stroke-width="2.5" stroke-linecap="round">
    <path d="M932 117H1043"/>
    <path d="M1169 117H1254"/>
    <path d="M990 117q0-56 57-56h26" stroke-width="1.5" opacity=".48"/>
    <path d="M1206 117q0 60-58 60h-11" stroke-width="1.5" opacity=".43"/>
  </g>
  <g fill="#ffd59f" opacity=".35" filter="url(#glow)">
    <circle cx="994" cy="117" r="12"/>
    <circle cx="1211" cy="117" r="11"/>
  </g>
  <g fill="#f6d5ac" stroke="#f6d5ac">
    <circle cx="990" cy="117" r="3"/>
    <circle cx="1213" cy="117" r="3"/>
    <circle cx="1050" cy="61" r="2.5"/>
    <circle cx="1152" cy="177" r="2.5"/>
  </g>
  <!-- Storage node -->
  <g transform="translate(813 49)">
    <rect x="0" y="0" width="119" height="136" rx="21" fill="url(#glass)" stroke="#deb788" stroke-opacity=".45"/>
    <rect x="16" y="20" width="87" height="96" rx="13" fill="#30231e" fill-opacity=".65" stroke="#b9946a" stroke-opacity=".35"/>
    <g fill="none" stroke="#f2d0a4" stroke-width="2.6" stroke-linecap="round">
      <rect x="29" y="34" width="61" height="20" rx="6"/>
      <rect x="29" y="60" width="61" height="20" rx="6"/>
      <rect x="29" y="86" width="61" height="20" rx="6"/>
    </g>
    <g fill="#e1b37d"><circle cx="42" cy="44" r="2.9"/><circle cx="42" cy="70" r="2.9"/><circle cx="42" cy="96" r="2.9"/></g>
    <g stroke="#ad8d6b" stroke-width="2" opacity=".85"><path d="M55 44h23M55 70h23M55 96h23"/></g>
  </g>
  <!-- API node, neutral decorative circuit emblem -->
  <g transform="translate(1041 33)">
    <rect x="0" y="0" width="126" height="169" rx="24" fill="url(#glass)" stroke="#f0c797" stroke-opacity=".6" stroke-width="1.4"/>
    <rect x="13" y="13" width="100" height="143" rx="18" fill="#2d231f" fill-opacity=".62" stroke="#dbb387" stroke-opacity=".26"/>
    <g fill="none" stroke="#f5d4a6" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
      <rect x="41" y="53" width="44" height="44" rx="11"/>
      <path d="M62 36v17 M62 97v17M24 75h17M85 75h17"/>
      <path d="M51 66l-9 9 9 9M73 66l9 9-9 9" stroke-width="2.6"/>
    </g>
    <circle cx="63" cy="131" r="3.8" fill="#eec996"/>
    <path d="M43 131h12 M71 131h12" stroke="#a98967" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Database node -->
  <g transform="translate(1250 52)">
    <rect x="0" y="0" width="127" height="133" rx="22" fill="url(#glass)" stroke="#deb788" stroke-opacity=".45"/>
    <g fill="none" stroke="#f4d5a8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="64" cy="37" rx="35" ry="13"/>
      <path d="M29 37v57c0 8 15 14 35 14s35-6 35-14V37"/>
      <path d="M29 58c0 8 15 14 35 14s35-6 35-14 M29 78c0 8 15 14 35 14s35-6 35-14"/>
    </g>
    <ellipse cx="64" cy="37" rx="35" ry="13" fill="#caa475" fill-opacity=".13"/>
  </g>
  <g opacity=".35" fill="none" stroke="#f8dcb5" stroke-width="2">
    <circle cx="1103" cy="119" r="97" stroke-dasharray="1 18"/>
    <path d="M1409 70h93m-93 15h64m-64 15h78M1448 156h71m-50 13h50" stroke-opacity=".45"/>
  </g>
</svg>