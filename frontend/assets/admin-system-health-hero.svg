<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" role="img" aria-labelledby="title desc">
  <title id="title">Medhmar platform infrastructure illustration</title>
  <desc id="desc">Clear gold server, API, and database symbols linked by a minimal network. Decorative illustration, not live system status.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2=".25">
      <stop stop-color="#251916"/>
      <stop offset=".52" stop-color="#432b21"/>
      <stop offset="1" stop-color="#68412d"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9dbac"/>
      <stop offset="1" stop-color="#d99f5e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f0be79" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#ffe1ad"/>
      <stop offset="1" stop-color="#eeb672" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="warmth">
      <stop stop-color="#eba75c" stop-opacity=".23"/>
      <stop offset="1" stop-color="#eba75c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="specks" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="1" fill="#ffddb0" fill-opacity=".11"/>
    </pattern>
  </defs>
  <rect width="1600" height="240" fill="url(#ground)"/>
  <rect x="725" width="735" height="240" fill="url(#specks)"/>
  <ellipse cx="1110" cy="122" rx="440" ry="187" fill="url(#warmth)"/>

  <!-- A restrained, decorative network; nodes are not monitoring results. -->
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
    <path d="M1007 119h61M1193 119h61"/>
  </g>
  <g fill="#ffe1b5">
    <circle cx="1037" cy="119" r="4"/>
    <circle cx="1224" cy="119" r="4"/>
  </g>

  <!-- SERVER: an easily recognized stack of three physical server units. -->
  <g transform="translate(877 56)">
    <rect x="0" y="0" width="130" height="126" rx="19"
      fill="#2e211c" fill-opacity=".91" stroke="url(#frame)" stroke-width="2.5"/>
    <rect x="13" y="13" width="104" height="100" rx="12"
      fill="#bd8a55" fill-opacity=".13" stroke="#f7d2a0" stroke-opacity=".25" stroke-width="1.5"/>
    <g fill="none" stroke="#ffe0b0" stroke-width="3.5" stroke-linejoin="round">
      <rect x="26" y="25" width="78" height="22" rx="6"/>
      <rect x="26" y="52" width="78" height="22" rx="6"/>
      <rect x="26" y="79" width="78" height="22" rx="6"/>
    </g>
    <g fill="#f8c681">
      <circle cx="39" cy="36" r="3.4"/>
      <circle cx="39" cy="63" r="3.4"/>
      <circle cx="39" cy="90" r="3.4"/>
    </g>
    <g stroke="#edc796" stroke-width="2.4" stroke-linecap="round">
      <path d="M55 36h34M55 63h34M55 90h34"/>
    </g>
  </g>

  <!-- API: a simple application chip, with clear code brackets. -->
  <g transform="translate(1068 56)">
    <rect x="0" y="0" width="125" height="126" rx="19"
      fill="#2e211c" fill-opacity=".91" stroke="url(#frame)" stroke-width="2.5"/>
    <rect x="12" y="12" width="101" height="102" rx="12"
      fill="#bd8a55" fill-opacity=".13" stroke="#f7d2a0" stroke-opacity=".25" stroke-width="1.5"/>
    <g fill="none" stroke="#ffe0b0" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="37" y="39" width="52" height="48" rx="10"/>
      <path d="m54 51-10 12 10 12M72 51l10 12-10 12M67 47l-8 32" stroke-width="3.2"/>
      <path d="M62.5 24v15M62.5 87v15M22 63h15M89 63h14" stroke-width="3.2"/>
    </g>
  </g>

  <!-- DATABASE: bold cylinders to remain legible at banner height. -->
  <g transform="translate(1254 56)">
    <rect x="0" y="0" width="130" height="126" rx="19"
      fill="#2e211c" fill-opacity=".91" stroke="url(#frame)" stroke-width="2.5"/>
    <rect x="13" y="13" width="104" height="100" rx="12"
      fill="#bd8a55" fill-opacity=".13" stroke="#f7d2a0" stroke-opacity=".25" stroke-width="1.5"/>
    <g fill="none" stroke="#ffe0b0" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="65" cy="37" rx="32" ry="12"/>
      <path d="M33 37v53c0 8 14 13 32 13s32-5 32-13V37"/>
      <path d="M33 56c0 8 14 13 32 13s32-5 32-13"/>
      <path d="M33 74c0 8 14 13 32 13s32-5 32-13"/>
    </g>
  </g>
  <!-- Small unobtrusive geometry to balance the right edge. -->
  <g fill="none" stroke="#efc28b" stroke-opacity=".19" stroke-width="2" stroke-linecap="round">
    <path d="M745 189h82M770 200h57M1417 63h94M1452 74h59"/>
  </g>
</svg>