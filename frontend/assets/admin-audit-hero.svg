<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" aria-hidden="true">
  <!-- Decorative audit illustration. No synthetic user actions or live status shown. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#2d1d18"/>
      <stop offset=".53" stop-color="#493024"/>
      <stop offset="1" stop-color="#704530"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9bd84" stop-opacity=".36"/>
      <stop offset="1" stop-color="#e9bd84" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f9ddaf"/>
      <stop offset=".55" stop-color="#f8cb89"/>
      <stop offset="1" stop-color="#f1b767"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f2bd76" stop-opacity=".23"/>
      <stop offset="1" stop-color="#f2bd76" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#f9d4a1" fill-opacity=".16"/>
    </pattern>
  </defs>
  <rect width="1600" height="220" fill="url(#background)"/>
  <rect x="830" y="0" width="660" height="220" fill="url(#dots)"/>
  <ellipse cx="1123" cy="113" rx="460" ry="180" fill="url(#halo)"/>
  <!-- Inset audit document: kept inside the visible hero safe area. -->
  <g transform="translate(932 45)">
    <rect x="0" y="0" width="156" height="130" rx="15" fill="#241a17" fill-opacity=".72" stroke="#f6cb92" stroke-width="2.4"/>
    <path d="M123 0v20c0 8 6 14 14 14h19" fill="url(#paper)" stroke="#f6cb92" stroke-width="2.4" stroke-linejoin="round"/>
    <rect x="18" y="16" width="76" height="7" rx="3.5" fill="#ffe0b0" fill-opacity=".8"/>
    <g fill="none" stroke="#ffe2b6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m20 49 7 7 12-15 M20 82l7 7 12-15 M20 115l7 7 12-15"/>
      <path d="M48 48h69 M48 81h69 M48 114h55" opacity=".94"/>
    </g>
  </g>
  <!-- Audit trail: restrained connectors, clear spacing. -->
  <g fill="none" stroke="#f4ce99" stroke-width="2.8" stroke-linecap="round">
    <path d="M1111 110h72"/>
    <path d="M1296 110h52"/>
    <path d="M1413 110h32" stroke-opacity=".4"/>
  </g>
  <g fill="#ffe1b5">
    <circle cx="1147" cy="110" r="4"/>
    <circle cx="1321" cy="110" r="4"/>
  </g>
  <!-- Protection: shield with a clearly legible lock. -->
  <g transform="translate(1186 49)">
    <path d="M55 0 107 20v39c0 35-24 62-52 76C27 121 3 94 3 59V20L55 0Z"
      fill="#261a15" fill-opacity=".78" stroke="url(#gold)" stroke-width="3.8" stroke-linejoin="round"/>
    <path d="M55 14 92 28v32c0 26-15 45-37 58-22-13-37-32-37-58V28Z"
      fill="#d5a069" fill-opacity=".13"/>
    <g stroke="#ffdfaa" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="38" y="59" width="35" height="33" rx="5" fill="#40291f" stroke-width="3.6"/>
      <path d="M45 58v-8a10 10 0 0 1 20 0v8"/>
      <path d="M55.5 72v8"/>
    </g>
    <circle cx="55.5" cy="70" r="2.8" fill="#ffdfaa"/>
  </g>
  <!-- Clock represents event history, not an actual timestamp. -->
  <g transform="translate(1374 110)" fill="none" stroke="#ffe0ae" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round">
    <circle r="34" fill="#2b1d17" fill-opacity=".72" stroke="url(#gold)"/>
    <path d="M0-18v18l13 9"/>
  </g>
  <g fill="none" stroke="#f4cd92" stroke-width="1.5" opacity=".25">
    <path d="M840 175h66M851 185h41 M1440 46h74 M1452 56h40"/>
    <circle cx="1239" cy="111" r="81" stroke-dasharray="2 13"/>
  </g>
</svg>