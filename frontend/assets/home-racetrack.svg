    <linearGradient id="farMountain" x2="0" y2="1"><stop stop-color="#be9c89" stop-opacity=".43"/><stop offset="1" stop-color="#dfc1aa" stop-opacity=".12"/></linearGradient>
    <linearGradient id="nearMountain" x2="0" y2="1"><stop stop-color="#b89079" stop-opacity=".42"/><stop offset="1" stop-color="#e5c8b0" stop-opacity=".08"/></linearGradient>
