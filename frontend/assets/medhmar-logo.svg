<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 58" role="img" aria-labelledby="title desc">
  <title id="title">MEDHMAR</title>
  <desc id="desc">Medhmar Oman Camel Racing wordmark</desc>
  <defs>
    <linearGradient id="medhmarGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0B46D"/>
      <stop offset=".55" stop-color="#C88E50"/>
      <stop offset="1" stop-color="#A96734"/>
    </linearGradient>
  </defs>

  <!-- Camel + racing track symbol -->
  <g transform="translate(2 3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path fill="url(#medhmarGold)" stroke="none"
      d="M2 33c10-4 18-5 27-4 4-8 9-15 15-19 5-4 10-3 15 1l6 5c4 3 9 2 13-3l5-7-3-3 5 1 5-1 6 4 5 1-2 5-9 2c-2 7-6 13-11 18-7 7-15 10-24 9-8-1-14-5-21-7-10-3-19-1-32 3z"/>
    <path d="M3 39c12-4 22-5 32-4 10 1 18 6 28 7 9 1 17-2 25-8" stroke="url(#medhmarGold)" stroke-width="3"/>
    <path d="M7 45c13-3 24-4 34-2 8 1 15 4 23 4 8 0 15-2 23-7" stroke="#D5A36E" stroke-width="1.5" opacity=".9"/>

    <!-- Omani heritage micro-detail -->
    <path d="M70 39v-8h5v-3h4v3h5v8m-10 0v-5h6v5" stroke="#D5A36E" stroke-width="1"/>
    <path d="M84 39V26m0 2c-4-4-7-5-10-5m10 6c4-4 7-5 10-4m-10 3c0-5 2-8 5-10" stroke="#D5A36E" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(109 7)">
    <text x="0" y="22" fill="#FFF8EE"
