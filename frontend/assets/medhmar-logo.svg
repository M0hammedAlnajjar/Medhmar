<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 58" role="img" aria-labelledby="title desc">
  <title id="title">MEDHMAR</title>
  <desc id="desc">Medhmar Oman Camel Racing wordmark</desc>

  <!-- Clean typographic logo without the camel/heritage illustration. -->
  <g transform="translate(4 7)">
    <text x="0" y="22" fill="#FFF8EE"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="24" font-weight="700" letter-spacing="1.9">MEDHMAR</text>

    <line x1="0" y1="31" x2="21" y2="31" stroke="#C99152" stroke-width="1.2"/>
    <text x="27" y="34" fill="#D8B17D"
      font-family="Arial, Helvetica, sans-serif"
      font-size="6.2" font-weight="700" letter-spacing="2.15">OMAN CAMEL RACING</text>
    <line x1="149" y1="31" x2="166" y2="31" stroke="#C99152" stroke-width="1.2"/>
  </g>
</svg>
