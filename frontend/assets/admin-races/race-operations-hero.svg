<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 220" role="img" aria-labelledby="raceTitle raceDescription">
  <title id="raceTitle">Medhmar race management illustration</title>
  <desc id="raceDescription">A gold outlined camel racing track, a racing camel emblem, and a checkered finish flag. Decorative illustration, not a live race.</desc>
  <defs>
    <linearGradient id="brown" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#251915"/><stop offset=".52" stop-color="#473023"/><stop offset="1" stop-color="#704630"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#ffe4b5"/><stop offset=".6" stop-color="#e7b778"/><stop offset="1" stop-color="#c58b51"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#e4ac70" stop-opacity=".20"/><stop offset="1" stop-color="#e4ac70" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="23" height="23">
      <circle cx="11.5" cy="11.5" r="1.1" fill="#f2cc9b" fill-opacity=".13"/>
    </pattern>
    <pattern id="checkers" patternUnits="userSpaceOnUse" width="27" height="26">
      <rect width="13.5" height="13" fill="#f9d59d"/><rect x="13.5" y="13" width="13.5" height="13" fill="#f9d59d"/>
    </pattern>
  </defs>
  <rect width="1600" height="220" fill="url(#brown)"/>
  <rect x="720" width="880" height="220" fill="url(#grain)"/>
  <ellipse cx="1153" cy="119" rx="457" ry="173" fill="url(#glow)"/>
  <!-- Stylized track with three distinct racing lanes -->
  <g stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="846" y="32" width="349" height="156" rx="78" stroke-width="3.5"/>
    <rect x="859" y="45" width="323" height="130" rx="65" stroke-width="2" stroke-opacity=".62"/>
    <rect x="873" y="59" width="295" height="102" rx="51" stroke-width="2" stroke-dasharray="8 11" stroke-opacity=".68"/>
    <path d="M1158 33v154M1172 41v138" stroke-opacity=".80" stroke-width="2.6"/>
  </g>
  <g fill="#f9d9a7" opacity=".96">
    <circle cx="874" cy="111" r="3.5"/><circle cx="885" cy="111" r="3.5"/>
  </g>
  <!-- Camel silhouette, intentionally iconographic rather than a cartoon character -->
  <g transform="translate(942 74) scale(2.0)" fill="url(#gold)">
    <path d="m5 30 3-9 5-4 7-1 4-5 5 1 5 5 10 1 4-9 1-6 5-1 3 2 5 1-2 4-7 1-2 14-5 8 2 12h-3l-5-12-13-1-3 13h-3l1-15-6 1-5 14H8l3-17-3-1-3 10H3Z"/>
  </g>
  <g stroke="#f9d8a5" stroke-linecap="round" fill="none">
    <path d="M946 178h80M963 185h45" stroke-width="1.5" stroke-opacity=".37"/>
    <path d="M1215 112h48" stroke-width="2.6" stroke-opacity=".68"/>
  </g>
  <circle cx="1240" cy="112" r="4" fill="#ffdda7"/>
  <!-- Finishing banner and flag, evocative of a race rather than a static animal illustration -->
  <g transform="translate(1300 26)" stroke="url(#gold)" stroke-linejoin="round">
    <rect x="0" y="0" width="156" height="169" rx="20" fill="#261a16" fill-opacity=".73" stroke-width="2.5"/>
    <path d="M48 22v120" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M50 35Q78 22 110 35L134 46Q103 55 75 45L50 53Z" fill="#34241c" stroke-width="2.4"/>
    <path d="M52 35Q80 24 110 35L134 46Q103 55 75 45L52 53Z" fill="url(#checkers)" opacity=".95" stroke="none"/>
    <path d="M45 145h31" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 149h62" stroke-width="2" stroke-opacity=".62" stroke-linecap="round"/>
    <path d="M96 101l12 12 23-28" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="113" cy="104" r="37" fill="none" stroke-width="1.5" stroke-opacity=".43"/>
  </g>
  <!-- Discreet secondary detailing on the far right -->
  <g fill="none" stroke="#f5ce94" stroke-width="2" stroke-linecap="round" opacity=".28">
    <path d="M1508 64h47M1519 76h36M1502 163h53M1521 176h34"/>
  </g>
</svg>