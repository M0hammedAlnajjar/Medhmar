<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="raceTitle raceDescription">
  <title id="raceTitle">Camel racing at the Medhmar track</title>
  <desc id="raceDescription">Three gold racing camels running toward a finish flag on a marked racetrack. Decorative illustration, not live race footage.</desc>
  <defs>
    <linearGradient id="track" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#e7ba7c" stop-opacity="0"/>
      <stop offset=".23" stop-color="#e7ba7c" stop-opacity=".48"/>
      <stop offset="1" stop-color="#e7ba7c" stop-opacity=".64"/>
    </linearGradient>
    <pattern id="checks" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f3d49b"/>
      <rect x="8" y="8" width="8" height="8" fill="#f3d49b"/>
    </pattern>
    <g id="racing-camel" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Long, extended legs and a single hump distinguish a racing dromedary. -->
      <g fill="#583b2b">
        <path d="M224 119 246 147 286 157 315 183 309 189 281 168 235 160 202 134Z"/>
        <path d="m114 117-18 26-31 13-30-9-4 7 34 15 36-15 31-25Z"/>
      </g>
      <g fill="#61412e">
        <path d="m133 123-8 32-24 25 3 27-8 2-11-31 24-34 2-25Z"/>
        <path d="m212 126 15 27 28 19 7 28-8 3-13-24-32-17-19-30Z"/>
        <path d="M43 34Q34 27 25 33l-12 5q-5 5 1 9l21 4 13-3c9 13 10 32 20 48 9 16 21 26 37 28 16 3 29 1 42-5 31 14 62 17 94 7 18-6 30-18 28-32-3-13-20-18-40-19l-23-1c-10-1-16-12-22-20-7-8-15-7-22-1-8 7-12 19-23 22-20 6-38-6-49-22L67 30l-3-10-7-1-2 9-7 2Z"/>
        <path d="M268 93q19-1 23-19" fill="none" stroke-width="3"/>
      </g>
      <path d="M31 48q8 0 15-4M49 30l9 4" fill="none" opacity=".65"/>
      <circle cx="30" cy="38" r="2" fill="currentColor" stroke="none"/>
      <!-- A compact robot jockey and saddle, as used in modern camel races. -->
      <path d="M143 87q32-10 71 1l-2 22q-33 8-66-3Z" fill="#80583b"/>
      <path d="M148 94q30 7 61 0m-60 9q29 7 59 0" fill="none" opacity=".6" stroke-width="1.4"/>
      <rect x="173" y="66" width="17" height="20" rx="3" fill="#735039"/>
      <path d="M181 66V55m-4 0h8m-10 19q-57-1-86-21L48 40" fill="none" stroke-width="1.5" opacity=".75"/>
    </g>
  </defs>
  <!-- Track barriers and lane markings stay inside the artwork's safe area. -->
  <g fill="none" stroke="url(#track)" stroke-linecap="round">
    <path d="M24 144q405-27 846 3" stroke-width="2"/>
    <path d="M28 151q402-28 842 3" stroke-width="1"/>
    <path d="M110 146v29m110-34v29m110-33v29m110-30v29m110-29v29m110-25v29m110-24v29m90-22v29" stroke-width="1.5"/>
    <path d="M16 193q418-24 854 3" stroke-width="2"/>
    <path d="M32 217q404-23 835 1" stroke-width="1.5" stroke-dasharray="24 17"/>
  </g>
  <g color="#cd9f66" opacity=".6">
    <use href="#racing-camel" transform="translate(278 45) scale(-.58 .58)"/>
  </g>
  <g color="#dfb57b" opacity=".78">
    <use href="#racing-camel" transform="translate(494 52) scale(-.67 .67)"/>
  </g>
  <g color="#f3d49b">
    <use href="#racing-camel" transform="translate(777 12) scale(-.91 .91)"/>
  </g>
  <!-- Finish post and checkered flag; all camels face the finish line. -->
  <g stroke="#f3d49b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M806 35v167m-7 3h14" fill="none" stroke-width="2.8"/>
    <path d="M809 44q19-9 38 0l26 10q-19 14-39 5l-25-4Z" fill="#3d2a1e" stroke-width="1.8"/>
    <path d="M809 44q19-9 38 0l26 10q-19 14-39 5l-25-4Z" fill="url(#checks)" stroke="none"/>
  </g>
  <g fill="#e6b97e" opacity=".5">
    <circle cx="480" cy="204" r="2"/><circle cx="469" cy="208" r="1.2"/>
    <circle cx="286" cy="194" r="1.6"/><circle cx="276" cy="198" r="1"/>
  </g>
</svg>
