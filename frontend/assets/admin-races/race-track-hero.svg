<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="raceTitle raceDescription">
 <title id="raceTitle">Illustrated camel racing track at golden hour</title>
 <desc id="raceDescription">Three racing camels, jockey equipment, a sand racetrack, railings and stadium lighting. Decorative SVG illustration.</desc>
 <defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2=".25">
   <stop stop-color="#fffbf4"/><stop offset=".38" stop-color="#fff5e6"/><stop offset=".7" stop-color="#f5d3a3"/><stop offset="1" stop-color="#dba16d"/>
  </linearGradient>
  <linearGradient id="sand" x1="0" y1="0" x2=".2" y2="1">
   <stop stop-color="#efc992"/><stop offset=".52" stop-color="#dab080"/><stop offset="1" stop-color="#ae7651"/>
  </linearGradient>
  <linearGradient id="camelGold" x1="0" y1="0" x2=".8" y2="1">
   <stop stop-color="#f5d29c"/><stop offset=".54" stop-color="#dba26c"/><stop offset="1" stop-color="#b87d4b"/>
  </linearGradient>
  <linearGradient id="camelTan" x1="0" y1="0" x2=".8" y2="1">
   <stop stop-color="#e4c19a"/><stop offset=".6" stop-color="#bd8c66"/><stop offset="1" stop-color="#a5724c"/>
  </linearGradient>
  <linearGradient id="softLight" x1="0" y1="0" x2="1" y2="0">
   <stop stop-color="#fffbf5"/><stop offset=".30" stop-color="#fffbf5" stop-opacity=".95"/>
   <stop offset=".53" stop-color="#fffbf5" stop-opacity=".55"/>
   <stop offset=".71" stop-color="#fffbf5" stop-opacity=".05"/><stop offset="1" stop-color="#fffbf5" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="dust"><stop stop-color="#fff2cf" stop-opacity=".55"/><stop offset="1" stop-color="#e6b87b" stop-opacity="0"/></radialGradient>
  <pattern id="sandmarks" width="77" height="31" patternUnits="userSpaceOnUse">
   <path d="M3 20q21-6 43-1M50 8l14-2" stroke="#8d633f" stroke-opacity=".18" stroke-width="1.8" fill="none"/>
  </pattern>
 </defs>
